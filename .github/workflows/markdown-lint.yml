name: Markdown Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint all Markdown files
        run: |
          markdownlint '**/*.md' \
            --ignore node_modules \
            --disable MD013 MD033 MD060
        # MD013 (line length) is disabled: tables and long evidence lines are intentional.
        # MD033 (inline HTML) is disabled: not used, kept for forward compatibility.
        # MD060 (table pipe spacing) is disabled: it conflicts with standard GitHub table style.

      - name: Summary
        if: success()
        run: echo "All Markdown files passed lint checks."
